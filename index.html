<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電車ぬりえ 3D</title>
<style>
  :root{
    --bg:#14171c;
    --panel:#1c2028;
    --panel2:#242a34;
    --line:#333a47;
    --txt:#eef0f4;
    --dim:#8992a3;
    --accent:#ff8a3d;
    --accent2:#4fc3f7;
    --ok:#5bd68a;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--txt);
    font-family:"Hiragino Sans","Yu Gothic UI",sans-serif;
    font-size:14px;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  header{
    flex:0 0 auto; background:var(--panel); border-bottom:1px solid var(--line);
    padding:10px 16px; display:flex; align-items:center; gap:14px;
  }
  header h1{
    font-size:16px; margin:0; font-weight:800; letter-spacing:.02em;
    display:flex; align-items:center; gap:8px;
  }
  header h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block;}
  .modeTabs{display:flex; gap:4px; background:var(--panel2); border-radius:8px; padding:3px;}
  .modeTabs button{
    border:none; background:transparent; color:var(--dim); font-weight:700; font-size:13px;
    padding:7px 16px; border-radius:6px; cursor:pointer; font-family:inherit;
  }
  .modeTabs button.on{background:var(--accent); color:#241205;}
  header .sp{flex:1;}
  .wrapBtn{
    background:linear-gradient(180deg,#ff9a52,var(--accent));
    border:none; color:#2a1300; font-weight:800; font-size:13px;
    padding:9px 18px; border-radius:8px; cursor:pointer; font-family:inherit;
    box-shadow:0 2px 0 #b85f1e;
  }
  .wrapBtn:active{transform:translateY(1px); box-shadow:0 1px 0 #b85f1e;}

  #paintView, #sceneView{flex:1 1 auto; min-height:0; display:none;}
  #paintView.on, #sceneView.on{display:flex;}

  /* ===== 塗り絵画面 ===== */
  #paintView{flex-direction:row;}
  #faceRail{
    flex:0 0 148px; background:var(--panel); border-right:1px solid var(--line);
    padding:12px 10px; overflow-y:auto;
  }
  #faceRail .lbl{font-size:11px; color:var(--dim); letter-spacing:.08em; margin:2px 2px 8px;}
  .faceBtn{
    width:100%; display:flex; flex-direction:column; align-items:center; gap:6px;
    background:var(--panel2); border:2px solid transparent; border-radius:10px;
    padding:10px 6px; margin-bottom:8px; cursor:pointer; color:var(--txt);
  }
  .faceBtn.on{border-color:var(--accent); background:#3a2a18;}
  .faceBtn .thumb{
    width:100%; aspect-ratio:1/1; border-radius:6px; background:#0d0f13;
    border:1px solid var(--line); overflow:hidden; position:relative;
  }
  .faceBtn .thumb canvas{width:100%;height:100%;object-fit:contain;}
  .faceBtn .fname{font-size:12px; font-weight:700;}
  .faceBtn .fdim{font-size:10px; color:var(--dim);}

  #paintCenter{flex:1 1 auto; display:flex; flex-direction:column; min-width:0; position:relative;}
  #canvasHost{
    flex:1 1 auto; display:flex; align-items:center; justify-content:center;
    background:
      linear-gradient(45deg,#20242c 25%,transparent 25%),
      linear-gradient(-45deg,#20242c 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#20242c 75%),
      linear-gradient(-45deg,transparent 75%,#20242c 75%);
    background-size:24px 24px;
    background-position:0 0,0 12px,12px -12px,-12px 0px;
    background-color:#171a20;
    padding:24px; overflow:auto; min-height:0;
  }
  #paintCanvas{
    background:#ffffff; border-radius:4px; touch-action:none;
    box-shadow:0 8px 30px #0007; cursor:crosshair;
  }

  #toolbar{
    flex:0 0 auto; background:var(--panel); border-top:1px solid var(--line);
    padding:10px 14px; display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .toolGroup{display:flex; align-items:center; gap:6px;}
  .toolGroup .glabel{font-size:11px; color:var(--dim); margin-right:2px;}
  .toolBtn{
    background:var(--panel2); border:1px solid var(--line); color:var(--txt);
    width:38px; height:38px; border-radius:8px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:17px;
  }
  .toolBtn.on{background:var(--accent); border-color:var(--accent); color:#241205;}
  .toolBtn:hover{border-color:#556;}
  input[type=range]{accent-color:var(--accent); width:90px;}
  #sizeVal{width:26px; font-size:12px; color:var(--dim); text-align:right;}

  .swatch{
    width:26px; height:26px; border-radius:6px; border:2px solid #0006; cursor:pointer;
  }
  .swatch.selected{outline:2px solid var(--accent); outline-offset:2px;}
  #presetRow{display:flex; gap:5px;}
  #curColorWrap{display:flex; align-items:center; gap:6px;}
  input[type=color]{
    width:34px; height:34px; padding:0; border:1px solid var(--line);
    border-radius:8px; background:none; cursor:pointer;
  }
  #hexInput{
    width:76px; background:#12151a; color:var(--txt); border:1px solid var(--line);
    border-radius:6px; padding:6px 7px; font-family:ui-monospace,monospace; font-size:12px;
  }

  button.plain{
    background:var(--panel2); border:1px solid var(--line); color:var(--txt);
    padding:8px 12px; border-radius:8px; cursor:pointer; font-family:inherit; font-size:12.5px;
  }
  button.plain:hover{border-color:#667;}
  #fileInputImg{display:none;}

  /* 画像配置中のオーバーレイ操作 */
  #imgAdjustBar{
    display:none; align-items:center; gap:10px; background:#1c2028; border:1px solid var(--accent2);
    padding:8px 12px; border-radius:8px; position:absolute; bottom:14px; left:50%; transform:translateX(-50%);
    font-size:12px; z-index:5;
  }
  #imgAdjustBar.on{display:flex;}
  #imgAdjustBar label{color:var(--dim);}

  /* ===== 3D画面 ===== */
  #sceneView{position:relative;}
  #sceneHost{flex:1; position:relative; min-width:0;}
  /* touch-action:none でスワイプがページスクロールに奪われず、視点回転に使える */
  #sceneHost canvas{display:block; width:100%; height:100%; touch-action:none;}
  #sceneControls{
    position:absolute; left:14px; bottom:14px; display:flex; flex-direction:column; gap:10px;
    background:#1c2028cc; backdrop-filter:blur(6px); border:1px solid var(--line);
    border-radius:12px; padding:12px 14px;
  }
  #sceneControls .row{display:flex; align-items:center; gap:8px;}
  #sceneControls .glabel{font-size:11px; color:var(--dim); width:64px;}
  .pillBtn{
    background:var(--panel2); border:1px solid var(--line); color:var(--txt);
    padding:8px 14px; border-radius:20px; cursor:pointer; font-family:inherit; font-size:13px; font-weight:700;
  }
  .pillBtn.on{background:var(--accent2); border-color:var(--accent2); color:#04222c;}
  .pillBtn:hover{border-color:#667;}
  #trackBtns{display:flex; gap:6px;}

  #toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    background:#000c; border:1px solid var(--line); padding:8px 16px; border-radius:16px;
    opacity:0; transition:opacity .2s; pointer-events:none; z-index:99; font-size:12.5px;
  }
  #toast.on{opacity:1;}

  #loadingScene{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--dim); font-size:13px;
  }

  /* ===== スマホ向け ===== */
  /* ボタン内の文字が縦に潰れないよう、どの幅でも折り返しを禁止する */
  button, .pillBtn, .plain, .wrapBtn, .modeTabs button{ white-space:nowrap; }

  @media (max-width: 780px){
    header{padding:8px 10px; gap:8px; overflow-x:auto;}
    header h1{font-size:13px; margin:0;}
    header h1 .dot{width:7px;height:7px;}
    .modeTabs button{padding:6px 10px; font-size:12px;}
    .wrapBtn{padding:8px 12px; font-size:12px;}

    /* 塗り絵：面リストを上部の横スクロールに変更して、描画領域を広く取る */
    #paintView{flex-direction:column;}
    #faceRail{
      flex:0 0 auto; width:100%; border-right:none; border-bottom:1px solid var(--line);
      padding:8px; overflow-x:auto; overflow-y:hidden;
    }
    #faceRail .lbl{display:none;}
    #faceList{display:flex; gap:8px;}
    .faceBtn{width:84px; flex:0 0 auto; margin-bottom:0; padding:6px 4px;}
    .faceBtn .fdim{display:none;}
    .faceBtn .fname{font-size:11px;}

    #canvasHost{padding:10px;}
    #toolbar{padding:8px 10px; gap:10px; overflow-x:auto;}
    .toolGroup{flex:0 0 auto;}
    .toolBtn{width:34px;height:34px;font-size:15px;}
    input[type=range]{width:70px;}
    .swatch{width:22px;height:22px;}
    #presetRow{flex-wrap:nowrap; overflow-x:auto; max-width:150px;}
    button.plain{padding:7px 10px; font-size:12px;}

    /* 3D：操作パネルを画面下に横並びで固定 */
    #sceneControls{
      left:8px; right:8px; bottom:8px; padding:10px;
      flex-direction:row; flex-wrap:wrap; gap:8px; align-items:center;
    }
    #sceneControls .glabel{width:auto;}
    .pillBtn{padding:7px 11px; font-size:12px;}
    #speedRange{width:80px;}
  }
</style>
</head>
<body>

<header>
  <h1><span class="dot"></span>電車ぬりえ 3D</h1>
  <div class="modeTabs">
    <button id="tabPaint" class="on">ぬりえ</button>
    <button id="tabScene">3Dプレビュー</button>
  </div>
  <span class="sp"></span>
  <button class="wrapBtn" id="bWrap">🚃 電車にラッピング！</button>
</header>

<div id="paintView" class="on">
  <div id="faceRail">
    <div class="lbl">めん を えらぶ</div>
    <div id="faceList"></div>
  </div>
  <div id="paintCenter">
    <div id="canvasHost">
      <canvas id="paintCanvas"></canvas>
    </div>
    <div id="imgAdjustBar">
      <label>おおきさ</label>
      <input type="range" id="imgScaleR" min="10" max="300" value="100">
      <button class="plain" id="bImgOk">配置を確定</button>
      <button class="plain" id="bImgCancel">取り消し</button>
    </div>
    <div id="toolbar">
      <div class="toolGroup">
        <span class="glabel">ツール</span>
        <button class="toolBtn on" id="toolPen" title="ペン">✏️</button>
        <button class="toolBtn" id="toolFill" title="塗りつぶし">🪣</button>
        <button class="toolBtn" id="toolEraser" title="消しゴム">🧹</button>
      </div>
      <div class="toolGroup">
        <span class="glabel">ふとさ</span>
        <input type="range" id="sizeRange" min="1" max="60" value="10">
        <span id="sizeVal">10</span>
      </div>
      <div class="toolGroup">
        <span class="glabel">いろ</span>
        <div id="presetRow"></div>
        <div id="curColorWrap">
          <input type="color" id="colorPicker" value="#ff8a3d">
          <input type="text" id="hexInput" value="#FF8A3D" maxlength="7">
        </div>
      </div>
      <div class="toolGroup">
        <button class="plain" id="bImgLoad">🖼️ 画像を読み込む</button>
        <input type="file" id="fileInputImg" accept="image/*">
      </div>
      <div class="toolGroup">
        <button class="plain" id="bClearFace">この面をクリア</button>
        <button class="plain" id="bGuide">窓ガイドを表示</button>
        <button class="plain" id="bUndo">元に戻す</button>
      </div>
    </div>
  </div>
</div>

<div id="sceneView">
  <div id="sceneHost"></div>
  <div id="sceneControls">
    <div class="row">
      <span class="glabel">回転</span>
      <button class="pillBtn" id="bSpin">▶ 回転する</button>
    </div>
    <div class="row">
      <span class="glabel">走行</span>
      <div id="trackBtns">
        <button class="pillBtn" id="bFwd">▶ 前進</button>
        <button class="pillBtn" id="bStop">■ 停止</button>
        <button class="pillBtn" id="bBack">◀ 後進</button>
      </div>
    </div>
    <div class="row">
      <span class="glabel">速度</span>
      <input type="range" id="speedRange" min="1" max="9" value="5">
    </div>
    <div class="row">
      <button class="pillBtn" id="bShot">📷 スクリーンショット</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';

/* ============================================================
   電車の寸法（この比率がそのまま各面キャンバスの縦横比になる）
   ============================================================ */
const TRAIN = { width: 2.0, height: 2.3, length: 8.0 };

// 線路まわりの寸法。車輪の位置決めにも使うので、車体と一緒に先に定義しておく
// （後ろで const 宣言すると、車体生成時にまだ初期化されておらずエラーになる）
const RAIL_GAUGE = 1.5;      // 2本のレールの間隔
const RAIL_TOP_Y = 0.47;     // レール上面の高さ（車輪の接地面）
const WHEEL_R = 0.3;         // 車輪の半径

// 面定義：id, ラベル, キャンバス解像度（寸法比に対応）
const FACES = [
  { id:'front', label:'正面',  w: TRAIN.width, h: TRAIN.height },
  { id:'back',  label:'背面',  w: TRAIN.width, h: TRAIN.height },
  { id:'right', label:'右側面', w: TRAIN.length, h: TRAIN.height },
  { id:'left',  label:'左側面', w: TRAIN.length, h: TRAIN.height },
  { id:'top',   label:'天井',  w: TRAIN.length, h: TRAIN.width },
];
const RES = 64; // 1メートルあたりのpx（解像度）

const state = {
  faceId: 'front',
  faces: {}, // id -> {canvas, ctx, undoStack}
  tool: 'pen',
  color: '#ff8a3d',
  size: 10,
};

const PRESETS = [
  '#ffffff','#1a1a1a','#e8384f','#f5941f','#f6d743','#4caf50',
  '#3f7fd1','#7ec4e8','#a855f7','#f472b6','#8d6e63','#9098a3',
];

/* ============================================================
   窓・ドアの下絵ガイド
   ============================================================ */
function drawGuide(id, ctx, w, h){
  ctx.save();
  ctx.strokeStyle = '#111111';
  ctx.lineJoin = 'round';

  if(id === 'front' || id === 'back'){
    ctx.lineWidth = Math.max(1, RES * 0.014);

    // 運転席窓（中央上部の大きめの窓）
    const winW = w*0.5, winH = h*0.3;
    roundRectStroke(ctx, (w-winW)/2, h*0.1, winW, winH, RES*0.1);

    // 車体の横帯（長方形。中を塗りつぶせばラインカラーになる）
    const bandX = w*0.06;
    const bandY = h*0.55;
    const bandW = w*0.88;
    const bandH = h*0.09;
    ctx.strokeRect(bandX, bandY, bandW, bandH);

    // ヘッドライト（左右2つの丸）
    const lightR = Math.min(w,h)*0.05;
    [0.22, 0.78].forEach(lx => {
      ctx.beginPath();
      ctx.arc(w*lx, h*0.74, lightR, 0, Math.PI*2);
      ctx.stroke();
    });

  } else if(id === 'right' || id === 'left'){
    ctx.lineWidth = Math.max(1, RES * 0.016);
    // 側面：等間隔の窓＋ドア2箇所
    // w/h はピクセル値なので、窓の個数は実寸（メートル）に直してから決める
    const lengthM = w / RES;
    const nWin = Math.max(3, Math.round(lengthM / 1.15));
    const doorPositions = [0.2, 0.8]; // 全長に対する比率でドアを2箇所
    const doorW = w*0.09;

    // ドア（縦長の四角）
    doorPositions.forEach(dp => {
      const dx = w*dp - doorW/2;
      roundRectStroke(ctx, dx, h*0.1, doorW, h*0.8, RES*0.05);
    });

    // 窓（ドアを避けて等間隔配置）
    const winW = (w/nWin) * 0.62;
    const winH = h*0.3;
    for(let i=0;i<nWin;i++){
      const cx = (w/nWin)*(i+0.5);
      const nearDoor = doorPositions.some(dp => Math.abs(cx - w*dp) < (doorW + winW)/2 * 1.05);
      if(nearDoor) continue;
      roundRectStroke(ctx, cx - winW/2, h*0.18, winW, winH, RES*0.05);
    }
  }
  // 天井はガイドなし

  ctx.restore();
}

function roundRectStroke(ctx, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
  ctx.stroke();
}

/* ============================================================
   面キャンバスの初期化
   ============================================================ */
function initFaces(){
  FACES.forEach(f => {
    const cv = document.createElement('canvas');
    cv.width = Math.round(f.w * RES);
    cv.height = Math.round(f.h * RES);
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,cv.width,cv.height);
    drawGuide(f.id, ctx, cv.width, cv.height);
    state.faces[f.id] = { canvas: cv, ctx, undoStack: [] };
    pushUndoSnapshot(f.id, true);
  });
}

function pushUndoSnapshot(id, isInit){
  const f = state.faces[id];
  const data = f.ctx.getImageData(0,0,f.canvas.width,f.canvas.height);
  f.undoStack.push(data);
  if(f.undoStack.length > 25) f.undoStack.shift();
}

function undoFace(id){
  const f = state.faces[id];
  if(f.undoStack.length < 2){ toast('これ以上戻せません'); return; }
  f.undoStack.pop();
  const prev = f.undoStack[f.undoStack.length-1];
  f.ctx.putImageData(prev, 0, 0);
  refreshThumb(id);
  syncMainCanvas();
}

/* ============================================================
   面選択UI（サムネイル一覧）
   ============================================================ */
const faceListEl = document.getElementById('faceList');
const faceBtnEls = {};

function buildFaceRail(){
  FACES.forEach(f => {
    const btn = document.createElement('button');
    btn.className = 'faceBtn' + (f.id === state.faceId ? ' on' : '');
    btn.innerHTML = `
      <div class="thumb"><canvas></canvas></div>
      <div class="fname">${f.label}</div>
      <div class="fdim">${f.w.toFixed(1)}×${f.h.toFixed(1)}m</div>
    `;
    btn.onclick = () => selectFace(f.id);
    faceListEl.appendChild(btn);
    faceBtnEls[f.id] = btn;
  });
  FACES.forEach(f => refreshThumb(f.id));
}

function refreshThumb(id){
  const btn = faceBtnEls[id];
  if(!btn) return;
  const thumbCv = btn.querySelector('.thumb canvas');
  const src = state.faces[id].canvas;
  thumbCv.width = src.width; thumbCv.height = src.height;
  thumbCv.getContext('2d').drawImage(src, 0, 0);
}

function selectFace(id){
  state.faceId = id;
  Object.values(faceBtnEls).forEach(b => b.classList.remove('on'));
  faceBtnEls[id].classList.add('on');
  syncMainCanvas();
}

/* ============================================================
   メイン編集キャンバス
   ============================================================ */
const mainCanvas = document.getElementById('paintCanvas');
const mainCtx = mainCanvas.getContext('2d');

function syncMainCanvas(){
  const f = state.faces[state.faceId];
  mainCanvas.width = f.canvas.width;
  mainCanvas.height = f.canvas.height;
  // 画面上の表示サイズ（縦横比を保ったまま、表示領域いっぱいに広げる）
  const host = document.getElementById('canvasHost');
  const pad = 28;
  const maxW = Math.max(160, (host.clientWidth || 640) - pad);
  const maxH = Math.max(140, (host.clientHeight || 460) - pad);
  const scale = Math.min(maxW / f.canvas.width, maxH / f.canvas.height, 3);
  mainCanvas.style.width = (f.canvas.width * scale) + 'px';
  mainCanvas.style.height = (f.canvas.height * scale) + 'px';
  mainCtx.drawImage(f.canvas, 0, 0);
}

function commitMainToFace(){
  const f = state.faces[state.faceId];
  f.ctx.drawImage(mainCanvas, 0, 0);
}

/* ---- 描画ツール ---- */
let drawing = false;
let lastPt = null;

function getPos(e){
  const r = mainCanvas.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX);
  const cy = (e.touches ? e.touches[0].clientY : e.clientY);
  const x = (cx - r.left) * (mainCanvas.width / r.width);
  const y = (cy - r.top) * (mainCanvas.height / r.height);
  return { x, y };
}

function strokeTo(p0, p1){
  mainCtx.lineCap = 'round';
  mainCtx.lineJoin = 'round';
  mainCtx.lineWidth = state.size;
  if(state.tool === 'eraser'){
    mainCtx.strokeStyle = '#ffffff';
  } else {
    mainCtx.strokeStyle = state.color;
  }
  mainCtx.beginPath();
  mainCtx.moveTo(p0.x, p0.y);
  mainCtx.lineTo(p1.x, p1.y);
  mainCtx.stroke();
}

function dotAt(p){
  mainCtx.fillStyle = state.tool === 'eraser' ? '#ffffff' : state.color;
  mainCtx.beginPath();
  mainCtx.arc(p.x, p.y, state.size/2, 0, Math.PI*2);
  mainCtx.fill();
}

function hexToRgba(hex){
  const v = hex.replace('#','');
  const r = parseInt(v.substring(0,2),16);
  const g = parseInt(v.substring(2,4),16);
  const b = parseInt(v.substring(4,6),16);
  return [r,g,b,255];
}

function floodFill(startX, startY, fillColor){
  startX = Math.floor(startX); startY = Math.floor(startY);
  const w = mainCanvas.width, h = mainCanvas.height;
  if(startX < 0 || startY < 0 || startX >= w || startY >= h) return;
  const imgData = mainCtx.getImageData(0,0,w,h);
  const data = imgData.data;
  const idx = (x,y) => (y*w+x)*4;
  const target = data.slice(idx(startX,startY), idx(startX,startY)+4);
  const [fr,fg,fb,fa] = fillColor;
  if(target[0]===fr && target[1]===fg && target[2]===fb && target[3]===fa) return;

  const tolerance = 40;
  function matches(i){
    return Math.abs(data[i]-target[0]) <= tolerance &&
           Math.abs(data[i+1]-target[1]) <= tolerance &&
           Math.abs(data[i+2]-target[2]) <= tolerance &&
           Math.abs(data[i+3]-target[3]) <= tolerance;
  }

  const stack = [[startX,startY]];
  const visited = new Uint8Array(w*h);
  while(stack.length){
    const [x,y] = stack.pop();
    if(x<0||y<0||x>=w||y>=h) continue;
    const p = y*w+x;
    if(visited[p]) continue;
    const i = p*4;
    if(!matches(i)) continue;
    visited[p] = 1;
    data[i]=fr; data[i+1]=fg; data[i+2]=fb; data[i+3]=fa;
    stack.push([x+1,y]); stack.push([x-1,y]); stack.push([x,y+1]); stack.push([x,y-1]);
  }
  mainCtx.putImageData(imgData, 0, 0);
}

function onPointerDown(e){
  if(imgPlacing) return;
  e.preventDefault();
  const p = getPos(e);
  if(state.tool === 'fill'){
    floodFill(p.x, p.y, hexToRgba(state.color));
    commitMainToFace(); pushUndoSnapshot(state.faceId); refreshThumb(state.faceId);
    return;
  }
  drawing = true;
  lastPt = p;
  dotAt(p);
}
function onPointerMove(e){
  if(!drawing) return;
  e.preventDefault();
  const p = getPos(e);
  strokeTo(lastPt, p);
  lastPt = p;
}
function onPointerUp(){
  if(!drawing) return;
  drawing = false;
  commitMainToFace();
  pushUndoSnapshot(state.faceId);
  refreshThumb(state.faceId);
}

mainCanvas.addEventListener('mousedown', onPointerDown);
mainCanvas.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);
mainCanvas.addEventListener('touchstart', onPointerDown, { passive:false });
mainCanvas.addEventListener('touchmove', onPointerMove, { passive:false });
mainCanvas.addEventListener('touchend', onPointerUp);

let imgPlacing = null; // {img, x,y, baseScale, curScale}

const imgScaleR = document.getElementById('imgScaleR');

    img.onload = () => startImagePlacement(img);

  };

function startImagePlacement(img){
  const cw = mainCanvas.width, ch = mainCanvas.height;
  const baseScale = Math.min(cw / img.width, ch / img.height) * 0.9;
  imgPlacing = { img, x: cw/2, y: ch/2, baseScale, curScale: 1 };
  imgScaleR.value = 100;
  imgAdjustBar.classList.add('on');
  redrawWithPlacement();
  enableImageDrag();
}

function redrawWithPlacement(){
  syncMainCanvas(); // 面の確定内容を再描画
  if(!imgPlacing) return;
  const { img, x, y, baseScale, curScale } = imgPlacing;
  const s = baseScale * (curScale);
  const w = img.width * s, h = img.height * s;
  mainCtx.drawImage(img, x - w/2, y - h/2, w, h);
}

imgScaleR.oninput = () => {
  imgPlacing.curScale = imgScaleR.value / 100;
  redrawWithPlacement();
};

});

/* ---- 簡易オービットカメラ（マウスドラッグで周回） ---- */
let camAngle = 0.7, camElev = 0.42, camDist = 26;
const CAM_MIN = 6, CAM_MAX = 90;
// カメラの注視点。走行中は電車を追いかけ、回転モードでは原点付近を見る。
const camTarget = new THREE.Vector3(0, 1.8, 0);
function updateCamera(){
  camera.position.set(
    camTarget.x + Math.sin(camAngle)*camDist*Math.cos(camElev),
    camTarget.y + Math.sin(camElev)*camDist,
    camTarget.z + Math.cos(camAngle)*camDist*Math.cos(camElev)
  );
  camera.lookAt(camTarget);
}
updateCamera();
function setCamDist(d){
  camDist = Math.max(CAM_MIN, Math.min(CAM_MAX, d));
  updateCamera();
}

/* ---- マウス：ドラッグで回転 / ホイールでズーム ---- */
let dragCam = false, dragStart = null;
renderer.domElement.addEventListener('pointerdown', e => {
  if(e.pointerType === 'touch') return;   // タッチは下の専用処理に任せる
  dragCam = true;
  dragStart = {x:e.clientX, y:e.clientY, a:camAngle, el:camElev};
});
window.addEventListener('pointerup', () => dragCam = false);
window.addEventListener('pointermove', e => {
  if(!dragCam) return;
  camAngle = dragStart.a - (e.clientX - dragStart.x) * 0.008;
  camElev = Math.max(0.05, Math.min(1.3, dragStart.el + (e.clientY - dragStart.y) * 0.006));
  updateCamera();
});
renderer.domElement.addEventListener('wheel', e => {
  setCamDist(camDist + e.deltaY * 0.02);
  e.preventDefault();
}, { passive:false });

/* ---- タッチ：1本指で回転 / 2本指のピンチで拡大縮小 ---- */
let touchMode = null;       // 'rotate' | 'pinch'
let touchStart = null;
function touchDist(t){
  return Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
}
renderer.domElement.addEventListener('touchstart', e => {
  const t = e.touches;
  if(t.length === 1){
    touchMode = 'rotate';
    touchStart = { x:t[0].clientX, y:t[0].clientY, a:camAngle, el:camElev };
  } else if(t.length >= 2){
    touchMode = 'pinch';
    touchStart = { d: touchDist(t), dist: camDist };
  }
  e.preventDefault();
}, { passive:false });

renderer.domElement.addEventListener('touchmove', e => {
  const t = e.touches;
  if(touchMode === 'pinch' && t.length >= 2){
    const d = touchDist(t);
    if(touchStart.d > 0){
      // 指を広げた分だけ近づく（＝拡大）
      setCamDist(touchStart.dist * (touchStart.d / d));
    }
  } else if(touchMode === 'rotate' && t.length === 1){
    camAngle = touchStart.a - (t[0].clientX - touchStart.x) * 0.008;
    camElev = Math.max(0.05, Math.min(1.3, touchStart.el + (t[0].clientY - touchStart.y) * 0.006));
    updateCamera();
  }
  e.preventDefault();
}, { passive:false });

renderer.domElement.addEventListener('touchend', e => {
  if(e.touches.length === 0){
    touchMode = null;
  } else if(e.touches.length === 1){
    // 2本指→1本指に減った時は、回転の基準を取り直す
    touchMode = 'rotate';
    touchStart = { x:e.touches[0].clientX, y:e.touches[0].clientY, a:camAngle, el:camElev };
  }
});

/* ---- 電車モデル（直方体本体＋台車。塗り絵は本体の6面のうち5面に対応） ---- */
let trainGroup, bodyMesh, wheelsGroup;
let faceTextures = {};

function buildTrain(){
  trainGroup = new THREE.Group();

  // 面ごとの初期マテリアル（後でラッピングボタンでテクスチャ差し替え）
  const matFor = id => new THREE.MeshStandardMaterial({ color:0xdfe3ea, roughness:0.55, metalness:0.05 });
  // BoxGeometryのマテリアル配列順： +X, -X, +Y, -Y, +Z, -Z
  const matRight = matFor('right');
  const matLeft  = matFor('left');
  const matTop   = matFor('top');
  const matBottom= new THREE.MeshStandardMaterial({ color:0x33383f, roughness:0.8 });
  const matFront = matFor('front');
  const matBack  = matFor('back');

  const bodyGeo = new THREE.BoxGeometry(TRAIN.width, TRAIN.height, TRAIN.length);
  bodyMesh = new THREE.Mesh(bodyGeo, [matRight, matLeft, matTop, matBottom, matFront, matBack]);
  // 高さは後段でレール基準に設定する
  trainGroup.add(bodyMesh);

  faceTextures = { front: matFront, back: matBack, right: matRight, left: matLeft, top: matTop };

  // 台車（車輪っぽい見た目、塗り絵対象外）
  wheelsGroup = new THREE.Group();
  const wheelMat = new THREE.MeshStandardMaterial({ color:0x24262b, roughness:0.5, metalness:0.4 });
  const bogieMat = new THREE.MeshStandardMaterial({ color:0x2e3238, roughness:0.6 });
  const skirtMat = new THREE.MeshStandardMaterial({ color:0x3a3f47, roughness:0.7 });

  // 高さの基準：車輪がレール上面に接地する
  const wheelY = RAIL_TOP_Y + WHEEL_R;        // 車輪の中心
  const skirtH = 0.5;
  const skirtY = wheelY + 0.28;               // 車輪の上半分を覆う裾板
  const bodyBottom = skirtY + skirtH/2;       // 車体はスカートの上に載る

  // スカート（裾板）。車輪を半分隠すことで、車やバスではなく電車のシルエットになる
  const skirt = new THREE.Mesh(
    new THREE.BoxGeometry(TRAIN.width*0.98, skirtH, TRAIN.length*0.97),
    skirtMat
  );
  skirt.position.y = skirtY;
  trainGroup.add(skirt);

  // 台車は車体の前後寄りに2つ。車輪の左右位置はレール幅(RAIL_GAUGE)に合わせる
  const bogieZ = TRAIN.length*0.3;
  [-bogieZ, bogieZ].forEach(bz => {
    const bogie = new THREE.Mesh(new THREE.BoxGeometry(TRAIN.width*0.7, 0.24, 1.6), bogieMat);
    bogie.position.set(0, wheelY + 0.2, bz);
    wheelsGroup.add(bogie);
    [-1,1].forEach(sx => {
      [-0.55, 0.55].forEach(wz => {
        const wheel = new THREE.Mesh(new THREE.CylinderGeometry(WHEEL_R, WHEEL_R, 0.1, 20), wheelMat);
        wheel.rotation.z = Math.PI/2;
        wheel.position.set(sx * (RAIL_GAUGE/2), wheelY, bz + wz);
        wheelsGroup.add(wheel);
      });
    });
  });
  trainGroup.add(wheelsGroup);

  // 車体をスカートの上に載せ直す
  bodyMesh.position.y = bodyBottom + TRAIN.height/2;
  const roofY = bodyBottom + TRAIN.height;

  // パンタグラフ（菱形の骨組み＋集電舟）。屋根の後ろ寄りに1基置く
  const pantoMat = new THREE.MeshStandardMaterial({ color:0x4a4f57, roughness:0.4, metalness:0.7 });
  const panto = new THREE.Group();
  panto.position.set(0, roofY, -TRAIN.length*0.22);

  // 土台（碍子）
  [-0.45, 0.45].forEach(px => {
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.12,8), pantoMat);
    base.position.set(px, 0.06, 0);
    panto.add(base);
  });

  // 下アーム（斜めに立ち上がる）／上アーム（頂点から前へ倒れる）
  const armLen = 0.95, armR = 0.032;
  function arm(x, y, z, rotX, len){
    const m = new THREE.Mesh(new THREE.CylinderGeometry(armR, armR, len, 6), pantoMat);
    m.position.set(x, y, z);
    m.rotation.x = rotX;
    return m;
  }
  const topY = 0.85;
  [-0.45, 0.45].forEach(px => {
    // 下アーム：後ろ下から前上へ
    panto.add(arm(px, 0.12 + Math.cos(0.9)*armLen/2, -0.35 + Math.sin(0.9)*armLen/2, 0.9, armLen));
    // 上アーム：頂点から後ろ上へ
    panto.add(arm(px, topY - Math.cos(0.75)*armLen/2, 0.25 - Math.sin(0.75)*armLen/2, -0.75, armLen));
  });

  // 集電舟（架線に触れる横棒）
  const shoe = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.05, 0.16), pantoMat);
  shoe.position.set(0, topY + 0.02, 0.1);
  panto.add(shoe);
  const shoeBar = new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,1.3,6), pantoMat);
  shoeBar.rotation.z = Math.PI/2;
  shoeBar.position.set(0, topY + 0.08, 0.1);
  panto.add(shoeBar);

  trainGroup.add(panto);

  scene.add(trainGroup);
}
buildTrain();

/* ---- ラッピング（各面canvas -> CanvasTexture反映） ----
   BoxGeometryの上面(+Y)は、UVのu軸が車体の「幅(X)」、v軸が「全長(Z)」に対応する。
   一方、天井のぬりえキャンバスは横長（横=全長）で描いてもらっているため、
   そのまま貼ると90度ズレる。天井だけ、回転させたキャンバスを作ってから貼る。 */
function makeTopCanvas(src){
  const out = document.createElement('canvas');
  out.width = src.height;   // 幅(X)方向
  out.height = src.width;   // 全長(Z)方向
  const c = out.getContext('2d');
  // 元キャンバスの左端（＝電車の前方）が、貼った時に前方(+Z)に来るように回す
  c.translate(out.width, 0);
  c.rotate(Math.PI/2);
  c.drawImage(src, 0, 0);
  return out;
}

function wrapTrain(){
  FACES.forEach(f => {
    let srcCanvas = state.faces[f.id].canvas;
    if(f.id === 'top') srcCanvas = makeTopCanvas(srcCanvas);
    const tex = new THREE.CanvasTexture(srcCanvas);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.needsUpdate = true;
    tex.wrapS = THREE.ClampToEdgeWrapping;
    tex.wrapT = THREE.ClampToEdgeWrapping;
    const mat = faceTextures[f.id];
    if(mat){
      if(mat.map) mat.map.dispose();
      mat.map = tex;
      mat.color.set(0xffffff);
      mat.needsUpdate = true;
    }
  });
  toast('電車にラッピングしました！');
  switchMode('scene');
}
document.getElementById('bWrap').onclick = wrapTrain;

/* ---- 線路走行 ---- */
/* ---- 線路（直線区間＋半円カーブの「オーバル」） ----
   楕円だと直線部分が無く常に曲がり続けるため、
   直線 L と半径 R の半円を組み合わせた陸上トラック型にする。
   距離（メートル）で位置を求められるので、速度をそのまま m/s で扱える。 */
const TRACK = { R: 13, L: 26, y: RAIL_TOP_Y };   // R:カーブ半径 / L:直線の長さ
const TRACK_LEN = 2*TRACK.L + 2*Math.PI*TRACK.R; // 一周の距離

// 距離 s（0〜TRACK_LEN）から位置を求める
function trackPointAt(s){
  const { R, L } = TRACK;
  s = ((s % TRACK_LEN) + TRACK_LEN) % TRACK_LEN;
  const arc = Math.PI * R;
  if(s < L){                       // ① 直線A：x=+R を -Z→+Z
    return new THREE.Vector3(R, 0, -L/2 + s);
  }
  s -= L;
  if(s < arc){                     // ② カーブA：+Z 側の半円
    const th = s / R;
    return new THREE.Vector3(Math.cos(th)*R, 0, L/2 + Math.sin(th)*R);
  }
  s -= arc;
  if(s < L){                       // ③ 直線B：x=-R を +Z→-Z
    return new THREE.Vector3(-R, 0, L/2 - s);
  }
  s -= L;                          // ④ カーブB：-Z 側の半円
  const th = Math.PI + s / R;
  return new THREE.Vector3(Math.cos(th)*R, 0, -L/2 + Math.sin(th)*R);
}

// 進行方向（単位ベクトル）。微小差分で求める
function trackTangentAt(s){
  const d = 0.05;
  const a = trackPointAt(s - d), b = trackPointAt(s + d);
  return b.sub(a).normalize();
}
// 進行方向に対して右手方向（レール幅を出すためのオフセット用）
function trackNormalAt(s){
  const t = trackTangentAt(s);
  return new THREE.Vector3(t.z, 0, -t.x);
}

const trackGroup = new THREE.Group();
const railMat = new THREE.MeshStandardMaterial({ color:0x9aa0a8, roughness:0.35, metalness:0.7 });
const sleeperMat = new THREE.MeshStandardMaterial({ color:0x6b4a30, roughness:0.9 });

function buildRail(offset){
  const pts = [];
  const N = 400;
  const railR = 0.06;
  for(let i=0;i<N;i++){
    const s = (i/N) * TRACK_LEN;
    const p = trackPointAt(s);
    const n = trackNormalAt(s);
    // チューブの中心を、上面が RAIL_TOP_Y になる高さに置く
    pts.push(new THREE.Vector3(p.x + n.x*offset, RAIL_TOP_Y - railR, p.z + n.z*offset));
  }
  const curve = new THREE.CatmullRomCurve3(pts, true);
  const geo = new THREE.TubeGeometry(curve, 600, railR, 8, true);
  return new THREE.Mesh(geo, railMat);
}
trackGroup.add(buildRail(RAIL_GAUGE/2));
trackGroup.add(buildRail(-RAIL_GAUGE/2));

// 枕木：はしごの横木のように、2本のレールに対して垂直に等間隔で並べる。
// 間隔を距離で決めることで、直線でもカーブでも同じ密度になる。
const SLEEPER_SPACING = 1.1;  // 枕木の間隔（m）
const SLEEPER_H = 0.1;
const nSleepers = Math.round(TRACK_LEN / SLEEPER_SPACING);
for(let i=0;i<nSleepers;i++){
  const s = (i/nSleepers) * TRACK_LEN;
  const pos = trackPointAt(s);
  const tan = trackTangentAt(s);
  // レールの外側まで少しはみ出す長さにすると、はしご状に見える
  const sleeper = new THREE.Mesh(
    new THREE.BoxGeometry(RAIL_GAUGE + 0.8, SLEEPER_H, 0.28),
    sleeperMat
  );
  sleeper.position.set(pos.x, RAIL_TOP_Y - 0.12 - SLEEPER_H/2, pos.z);
  sleeper.rotation.y = Math.atan2(tan.x, tan.z) + Math.PI/2;
  trackGroup.add(sleeper);
}
scene.add(trackGroup);

/* ---- 背景の木（動いていることが分かりやすくなる目印） ---- */
// 毎回同じ配置になるよう、乱数は固定シードの簡易生成器を使う
function makeRandom(seed){
  let s = seed;
  return () => { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; };
}

function makeTree(scale){
  const tree = new THREE.Group();
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.16, 0.22, 1.4, 7),
    new THREE.MeshStandardMaterial({ color:0x7a5433, roughness:0.95 })
  );
  trunk.position.y = 0.7;
  tree.add(trunk);
  // 葉を3段の円錐にして、もこもこした木にする
  const leafMat = new THREE.MeshStandardMaterial({ color:0x2f8f43, roughness:0.9 });
  [[1.5, 1.15, 1.5], [2.3, 0.95, 1.3], [3.0, 0.7, 1.0]].forEach(([y, r, h]) => {
    const cone = new THREE.Mesh(new THREE.ConeGeometry(r, h*1.6, 8), leafMat);
    cone.position.y = y;
    tree.add(cone);
  });
  tree.scale.setScalar(scale);
  return tree;
}

const treeGroup = new THREE.Group();
const rnd = makeRandom(20260811);
const TREE_COUNT = 90;
let placed = 0, tries = 0;
while(placed < TREE_COUNT && tries < 3000){
  tries++;
  const x = (rnd()*2 - 1) * 75;
  const z = (rnd()*2 - 1) * 75;
  // 線路に近すぎる場所には置かない（軌道上や内側の見通しを塞がないため）
  const insideOval =
    Math.abs(x) < TRACK.R + 4 && Math.abs(z) < TRACK.L/2 + TRACK.R + 4;
  const nearRail = Math.hypot(
    Math.max(0, Math.abs(x) - TRACK.R),
    Math.max(0, Math.abs(z) - TRACK.L/2)
  );
  if(insideOval) continue;
  if(nearRail < 5) continue;
  if(Math.hypot(x, z) > 80) continue;

  const tree = makeTree(0.9 + rnd()*0.9);
  tree.position.set(x, 0, z);
  tree.rotation.y = rnd() * Math.PI * 2;
  treeGroup.add(tree);
  placed++;
}
scene.add(treeGroup);

let trackS = 0;          // 一周のうち何メートル進んだか
let trackDir = 0;        // -1,0,1
let trackSpeed = 5;      // m/s（スライダーの中央）
const speedRange = document.getElementById('speedRange');
speedRange.oninput = () => { trackSpeed = +speedRange.value; };

const bFwd = document.getElementById('bFwd');
const bBack = document.getElementById('bBack');
const bStop = document.getElementById('bStop');
function setTrackDir(d){
  trackDir = d;
  bFwd.classList.toggle('on', d === 1);
  bBack.classList.toggle('on', d === -1);
  bStop.classList.toggle('on', d === 0);
}
bFwd.onclick = () => setTrackDir(1);
bBack.onclick = () => setTrackDir(-1);
bStop.onclick = () => setTrackDir(0);
setTrackDir(0);

function updateTrainOnTrack(dt){
  if(trackDir !== 0){
    // trackS は「一周の距離のうち何メートル進んだか」。
    // trackSpeed をそのまま m/s として使えるので、速度の感覚がつかみやすい。
    trackS += trackDir * (dt/1000) * trackSpeed;
    trackS = ((trackS % TRACK_LEN) + TRACK_LEN) % TRACK_LEN;
  }
  const pos = trackPointAt(trackS);
  const tan = trackTangentAt(trackS);
  trainGroup.position.set(pos.x, 0, pos.z);
  let heading = Math.atan2(tan.x, tan.z);
  if(trackDir === -1) heading += Math.PI;
  trainGroup.rotation.y = heading;
}

/* ---- レンダーループ ---- */
let lastTime = performance.now();
function animate(now){
  requestAnimationFrame(animate);
  const dt = now - lastTime;
  lastTime = now;

  if(spinning){
    // 回転モード：電車はレール中央に留めて、その場でくるくる回す
    trainGroup.position.set(0, 0, 0);
    trainGroup.rotation.y += dt * 0.001;
    camTarget.lerp(new THREE.Vector3(0, 1.8, 0), 0.05);
  } else {
    updateTrainOnTrack(dt);
    // 走行中はカメラが電車をゆるやかに追いかける
    camTarget.lerp(new THREE.Vector3(trainGroup.position.x, 1.8, trainGroup.position.z), 0.05);
  }
  updateCamera();

  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

/* ---- スクリーンショット ----
   iPhoneのSafariはダウンロードリンクだと「ファイル」アプリ行きか新規タブ表示になり
   分かりにくいため、共有シート（写真に保存が選べる）が使える端末ではそちらを優先する。 */
document.getElementById('bShot').onclick = async () => {
  renderer.render(scene, camera);
  const name = `train-${new Date().toISOString().replace(/[:.]/g,'-').slice(0,19)}.png`;

  const blob = await new Promise(res => renderer.domElement.toBlob(res, 'image/png'));
  if(!blob){ toast('画像の作成に失敗しました'); return; }

  const file = new File([blob], name, { type:'image/png' });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{
      await navigator.share({ files:[file] });
      return;
    }catch(err){
      if(err && err.name === 'AbortError') return;  // ユーザーが共有をキャンセルした
      // 共有に失敗した場合は、下のダウンロード方式にそのまま進む
    }
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('スクリーンショットを保存しました');
};

/* ============================================================
   トースト
   ============================================================ */
let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), 1800);
}

/* ============================================================
   初期化
   ============================================================ */
initFaces();
buildFaceRail();
buildPresets();
setColor(state.color);
syncMainCanvas();
resizeScene();

// 画面回転・リサイズ時に、描画中の内容を保ったまま表示サイズだけ再計算する。
// syncMainCanvas 自体が canvas の表示サイズを変えるため、監視をそのまま繋ぐと
// 再帰的に発火し続ける。実際に領域サイズが変わった時だけ走らせる。
const hostEl = document.getElementById('canvasHost');
let lastHostSize = '';
function handleHostResize(){
  const key = hostEl.clientWidth + 'x' + hostEl.clientHeight;
  if(key === lastHostSize) return;
  lastHostSize = key;
  if(!imgPlacing) syncMainCanvas();
}
window.addEventListener('resize', () => { handleHostResize(); resizeScene(); });
new ResizeObserver(handleHostResize).observe(hostEl);

</script>
